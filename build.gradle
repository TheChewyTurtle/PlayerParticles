import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'com.gradleup.shadow' version '9.2.2'
    id 'maven-publish'
    id 'java-library'
}

group = 'dev.esophose'
// Upstream 8.13 (Paper 26.2, RoseGarden 1.5.7) plus the Folia fork fixes; see ../FOLIA_SUPPORT.md
version = '8.13-FOLIA'

java {
    targetCompatibility = JavaVersion.VERSION_1_8
    sourceCompatibility = JavaVersion.VERSION_1_8
    disableAutoTargetJvm() // Allows depending on Paper's newer APIs even though they use Java 17

    withJavadocJar()
    withSourcesJar()
}

compileJava {
    options.compilerArgs += ['-parameters']
    options.fork = true
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()

    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.codemc.org/repository/maven-public' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://repo.rosewooddev.io/repository/public/' }
}

dependencies {
    // Pinned to the same Paper 26.2 build the other Killion plugins use (upstream uses 26.2.build.+)
    compileOnly 'io.papermc.paper:paper-api:26.2.build.121-stable'
    compileOnly 'org.jetbrains:annotations:24.0.1'
    compileOnly 'me.clip:placeholderapi:2.12.2'
    api 'org.codemc.worldguardwrapper:worldguardwrapper:1.2.1-SNAPSHOT'
    // RoseGarden 1.5.7+: year-based server versions (26.x) and the Folia scheduler wrapper
    api 'dev.rosewood:rosegarden:1.5.7'
}

shadowJar {
    archiveClassifier.set('')
    minimize()

    relocate('dev.rosewood.rosegarden', 'dev.esophose.playerparticles.libs.rosegarden')
    relocate('org.codemc.worldguardwrapper', 'dev.esophose.playerparticles.libs.worldguardwrapper')
}

processResources {
    from (sourceSets.main.resources.srcDirs) {
        include '**/*.yml'
        filter ReplaceTokens, tokens: ["version": project.property("version")]
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            from components.shadow
            artifactId = 'playerparticles'
            pom {
                name = 'playerparticles'
            }
        }
    }
    repositories {
        if (project.hasProperty('mavenUser') && project.hasProperty('mavenPassword')) {
            maven {
                credentials {
                    username = project.mavenUser
                    password = project.mavenPassword
                }

                def releasesRepoUrl = 'https://repo.rosewooddev.io/repository/public-releases/'
                def snapshotsRepoUrl = 'https://repo.rosewooddev.io/repository/public-snapshots/'
                url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            }
        }
    }
}

javadoc {
    options.encoding = 'UTF-8'
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

build.dependsOn shadowJar
generateMetadataFileForShadowPublication.dependsOn jar
